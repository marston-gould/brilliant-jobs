# worker/fly.toml — Fly.io deployment config
# AS-1: Headless browser worker for auto-submit
# Scales to zero when idle

app = "brilliant-jobs-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  WORKER_POLL_INTERVAL_MS = "30000"
  MAX_CONCURRENT_BROWSERS = "5"
  SUBMISSION_DELAY_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # AUDIT-D3-006: keep 1 machine warm — cold start delays apply submissions

[[http_service.checks]]
  # AUDIT-D3-006: poll /health so Fly detects hung/deadlocked worker, not just crashes
  grace_period = "10s"
  interval = "15s"
  restart_limit = 3
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
