<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 16px; font-family: -apple-system, system-ui, sans-serif; margin: 0; }
    h3 { margin: 0 0 8px; font-size: 15px; color: #1a1a2e; }
    p { font-size: 12px; color: #666; margin: 0 0 12px; line-height: 1.4; }
    .status { padding: 8px; border-radius: 6px; font-size: 11px; margin-bottom: 8px; }
    .synced { background: #dcfce7; color: #166534; }
    .not-synced { background: #fef3c7; color: #92400e; }
    .info { font-size: 10px; color: #999; margin-top: 8px; }
    button { width: 100%; padding: 8px; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    button:hover { background: #dc2626; }
  </style>
</head>
<body>
  <h3>✨ Brilliant Jobs</h3>
  <p>LinkedIn profile sync for resume alignment checking.</p>
  <div id="status" class="status not-synced">No profile synced yet</div>
  <div id="profile-info"></div>
  <button id="clear-btn" style="display:none;" onclick="clearProfile()">Clear Synced Data</button>
  <div class="info">
    Navigate to your LinkedIn profile page and click the "Sync to Brilliant Jobs" button to capture your data.
    This data stays local and is only used for resume consistency checking.
  </div>
  <script>
    chrome.storage.local.get('bj_linkedin_profile', (data) => {
      const profile = data.bj_linkedin_profile;
      if (profile && profile.name) {
        document.getElementById('status').className = 'status synced';
        document.getElementById('status').textContent = '✅ Profile synced';
        document.getElementById('profile-info').innerHTML =
          '<div style="font-size:12px;margin:8px 0;">' +
          '<strong>' + profile.name + '</strong><br>' +
          '<span style="color:#666;">' + (profile.current_title || '') + ' at ' + (profile.current_company || '') + '</span><br>' +
          '<span style="font-size:10px;color:#999;">Captured: ' + new Date(profile.captured_at).toLocaleDateString() + '</span>' +
          '</div>';
        document.getElementById('clear-btn').style.display = '';
      }
    });

    function clearProfile() {
      chrome.storage.local.remove('bj_linkedin_profile', () => {
        document.getElementById('status').className = 'status not-synced';
        document.getElementById('status').textContent = 'Profile data cleared';
        document.getElementById('profile-info').innerHTML = '';
        document.getElementById('clear-btn').style.display = 'none';
      });
    }
  </script>
</body>
</html>
