<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">\
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="./styles.css" />
  <title>Jobscan Extension Installed</title>
</head>
<body class="installed-body">
  <div class="wrapper">
    <div class="left-side">
      <img src="./assets/logo.svg" alt="jobscan logo" class="logo">
      <span class="title">
        Chrome extension installed successfully!
      </span>
      <a href="https://app.jobscan.co/auth/login" target="_blank" class="link">
        <button class="button">
          Go To Sign In
        </button>
      </a>

    <div class="right-side">
      <img src="./assets/extension-pin.svg" alt="tutorial on pinning the extension">
      <img src="./assets/save-tutorial.svg" alt="tutorial saving a job">
    </div>
  </div>

</html>
