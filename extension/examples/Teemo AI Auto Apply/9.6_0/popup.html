<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoApply Configurations</title>
  <!-- Add Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self';" />
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #a5b4fc;
      --secondary: #ec4899;
      --secondary-dark: #db2777;
      --success: #10b981;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.1);
      --shadow-sm: 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --radius: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --glass-bg: rgba(255, 255, 255, 0.25);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        sans-serif;
      width: 380px;
      min-height: 400px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 100%);
      color: var(--text-primary);
      line-height: 1.6;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 25% 25%, rgba(120, 119, 198, 0.4) 0%, transparent 60%),
        radial-gradient(circle at 75% 75%, rgba(255, 118, 117, 0.4) 0%, transparent 60%),
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
      animation: backgroundShift 10s ease-in-out infinite;
    }

    @keyframes backgroundShift {

      0%,
      100% {
        opacity: 1;
      }

      33% {
        opacity: 0.8;
      }

      66% {
        opacity: 0.9;
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      margin: 16px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container:hover {
      transform: translateY(-2px);
      box-shadow:
        0 30px 60px -12px rgba(0, 0, 0, 0.25),
        0 18px 36px -18px rgba(0, 0, 0, 0.3);
    }

    .header {
      background: linear-gradient(135deg,
          var(--primary) 0%,
          var(--primary-dark) 50%,
          var(--secondary) 100%);
      padding: 28px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      animation: rotate 6s linear infinite;
    }

    .header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.15) 50%,
          transparent 70%);
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmer {

      0%,
      100% {
        transform: translateX(-100%);
      }

      50% {
        transform: translateX(100%);
      }
    }

    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius);
      padding: 10px;
      position: relative;
      z-index: 2;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo:hover {
      transform: scale(1.1) rotate(8deg);
      background: rgba(255, 255, 255, 0.3);
    }

    .logo svg {
      width: 100%;
      height: 100%;
      stroke: white;
      stroke-width: 2;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .title {
      color: white;
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      position: relative;
      z-index: 2;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      letter-spacing: -0.025em;
    }

    .title a {
      color: inherit;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .title a:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .content {
      padding: 28px 24px 24px;
      background: linear-gradient(to bottom, rgba(248, 250, 252, 0.6), rgba(255, 255, 255, 0.9));
    }

    .button {
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }

    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .button:hover::before {
      left: 100%;
    }

    .button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    .button:active {
      transform: translateY(-1px) scale(0.98);
      transition: all 0.15s ease;
    }

    .button-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: 1px solid rgba(99, 102, 241, 0.4);
      box-shadow:
        0 8px 25px rgba(99, 102, 241, 0.3),
        0 3px 10px rgba(99, 102, 241, 0.2);
    }

    .button-primary:hover {
      background: linear-gradient(135deg, var(--primary-dark) 0%, #3730a3 100%);
      box-shadow:
        0 12px 35px rgba(99, 102, 241, 0.4),
        0 5px 15px rgba(99, 102, 241, 0.3);
    }

    .button-secondary {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      border: 1px solid rgba(236, 72, 153, 0.4);
      box-shadow:
        0 8px 25px rgba(236, 72, 153, 0.3),
        0 3px 10px rgba(236, 72, 153, 0.2);
    }

    .button-secondary:hover {
      background: linear-gradient(135deg, var(--secondary-dark) 0%, #be185d 100%);
      box-shadow:
        0 12px 35px rgba(236, 72, 153, 0.4),
        0 5px 15px rgba(236, 72, 153, 0.3);
    }

    .button-tertiary {
      background: linear-gradient(135deg, var(--text-secondary) 0%, #475569 100%);
      border: 1px solid rgba(100, 116, 139, 0.4);
      box-shadow:
        0 8px 25px rgba(100, 116, 139, 0.25),
        0 3px 10px rgba(100, 116, 139, 0.15);
    }

    .button-tertiary:hover {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      box-shadow:
        0 12px 35px rgba(100, 116, 139, 0.35),
        0 5px 15px rgba(100, 116, 139, 0.25);
    }

    .button a {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      text-align: center;
    }

    .btn-icon {
      font-size: 18px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    .button:hover .btn-icon {
      transform: scale(1.2) rotate(8deg);
    }

    .help-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 18px 16px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: var(--radius);
      background: rgba(248, 250, 252, 0.5);
      backdrop-filter: blur(10px);
    }

    .help-link:hover {
      color: var(--primary);
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .help-link i {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .help-link:hover i {
      transform: scale(1.15) rotate(5deg);
    }

    .footer {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      background: linear-gradient(to right, rgba(248, 250, 252, 0.9), rgba(241, 245, 249, 0.9));
      backdrop-filter: blur(15px);
      font-weight: 500;
    }

    /* Login section styles */
    #login-container {
      width: 100%;
    }

    .input-field {
      width: 100%;
      padding: 18px;
      margin-bottom: 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      font-weight: 500;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      background: rgba(255, 255, 255, 1);
      transform: translateY(-1px);
    }

    .error-message {
      color: #ef4444;
      font-size: 14px;
      margin-bottom: 18px;
      text-align: center;
      display: none;
      padding: 14px;
      border-radius: var(--radius);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      backdrop-filter: blur(15px);
      font-weight: 500;
    }

    #button-column {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .custom-login-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      width: 100%;
      text-align: center;
    }

    /* Enhanced animations */
    .container {
      animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .content>* {
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .content>*:nth-child(1) {
      animation-delay: 0.1s;
    }

    .content>*:nth-child(2) {
      animation-delay: 0.2s;
    }

    .content>*:nth-child(3) {
      animation-delay: 0.3s;
    }

    .content>*:nth-child(4) {
      animation-delay: 0.4s;
    }

    .content>*:nth-child(5) {
      animation-delay: 0.5s;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Enhanced status indicator */
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--success), #059669);
      display: inline-block;
      margin-right: 12px;
      animation: pulse 2.5s ease-in-out infinite;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.15);
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
      }
    }

    /* Responsive for very small screens */
    @media (max-width: 360px) {
      body {
        width: 340px;
      }

      .content {
        padding: 24px 20px 20px;
      }

      .button {
        padding: 16px 20px;
        font-size: 14px;
      }

      .header {
        padding: 24px 20px;
      }
    }

    /* Enhanced focus states for accessibility */
    .button:focus-visible,
    .help-link:focus-visible {
      outline: 3px solid rgba(99, 102, 241, 0.6);
      outline-offset: 3px;
    }

    /* Micro-interactions for better UX */
    .logo,
    .button,
    .help-link {
      will-change: transform;
    }

    /* Add subtle glow effects */
    .button-primary {
      position: relative;
    }

    .button-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.6), rgba(79, 70, 229, 0.6));
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: xor;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .button-primary:hover::after {
      opacity: 1;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <path d="M9 14l2 2 4-4"></path>
        </svg>
      </div>
      <h1 class="title">
        <a href="https://portal.teemo.ai/home" target="_blank">Teemo AI</a>
      </h1>
    </div>

    <div class="content">
      <!-- Login status message -->
      <div id="login-container" style="display: none">
        <p class="button button-primary" id="login-button">
          <i class="fas fa-sign-in-alt btn-icon"></i>
          <span>Login to Teemo AI</span>
        </p>
      </div>

      <!-- Main UI will be shown when user is logged in -->
      <div id="main-container" style="display: none; width: 100%">
        <div id="button-column">
          <!-- Manage Profile Button -->
          <button id="profile-button" class="button button-primary">
            <i class="fas fa-user-circle btn-icon"></i>
            <span>Manage Profile</span>
          </button>
          <!-- Logout Button -->
          <button id="logout-button" class="button button-tertiary">
            <i class="fas fa-sign-out-alt btn-icon"></i>
            <span>Logout</span>
          </button>
        </div>
      </div>

      <a href="https://portal.teemo.ai/help" target="_blank" class="help-link">
        <i class="fas fa-question-circle"></i>
        <span>Help & Support</span>
      </a>
    </div>

    <div class="footer">
      <span class="status-indicator"></span>
      Extension Active
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
