# Edge Function Auth Classification Registry
# ===========================================
# Created: CS-P1-001 (Phase 1 Remediation — SE-004)
# Owner: Security Engineer
# Last audited: 2026-03-06
#
# RULES:
#   1. Every Edge Function MUST be listed here
#   2. CI validates that code matches classification (Gate 04)
#   3. New EFs must be classified before merge (PR template enforces this)
#   4. Reclassification requires Security Engineer approval + ADR
#
# CLASSIFICATIONS:
#   admin-only      — Requires admin role via requireAdmin() middleware
#   authenticated   — Requires valid user JWT via auth.getUser()
#   cron-internal   — Called by pg_cron / internal service. No user JWT.
#                     Uses SERVICE_ROLE_KEY. Not directly user-callable.
#   webhook         — Called by external service (Stripe, Resend, Vonage).
#                     Validated by signature/secret, not user JWT.
#   public          — Intentionally unauthenticated. Must have rate limiting
#                     and CORS restriction. Requires explicit ADR justification.

functions:

  # ─── ADMIN-ONLY (4) ────────────────────────────────────────────────
  # These enforce requireAdmin() from _shared/admin-auth.ts
  # Only users with profiles.role = 'admin' can call these

