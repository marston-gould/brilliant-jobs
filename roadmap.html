<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --bg: #0c0e13;
      --bg-card: #13151c;
      --bg-card-hover: #181b24;
      --border: #1e2130;
      --border-hover: #2a2e42;
      --text: #e2e4ea;
      --text-dim: #9ba1b4;
      --text-faint: #5c6278;
      --accent: #4d8eff;
      --accent-glow: rgba(77,142,255,0.08);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.1);
      --green-bg: rgba(52,211,153,0.06);
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.1);
      --amber-bg: rgba(245,158,11,0.06);
      --red: #f87171;
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.1);
      --sans: 'Outfit', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 32px 120px;
    }

    /* Header */
    .header {
      margin-bottom: 56px;
      animation: fadeUp 0.6s ease-out;
    }
    .header-brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    }
    .header-mark {
      width: 36px; height: 36px; background: #fff; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: var(--bg);
    }
    .header-brand h1 {
      font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px;
    }
    .header h2 {
      font-size: 38px; font-weight: 800; letter-spacing: -1.5px;
      background: linear-gradient(135deg, #fff 0%, #4d8eff 50%, #a78bfa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.15; margin-bottom: 12px;
    }
    .header p {
      font-size: 15px; color: var(--text-dim); max-width: 600px; line-height: 1.7;
    }
    .header-meta {
      display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap;
    }
    .header-stat {
      display: flex; align-items: center; gap: 8px;
    }
    .header-stat .val {
      font-family: var(--mono); font-size: 22px; font-weight: 700; color: #fff;
    }
    .header-stat .lbl {
      font-size: 12px; color: var(--text-faint); text-transform: uppercase;
      letter-spacing: 0.5px; font-weight: 600;
    }
    .progress-bar-outer {
      width: 100%; height: 6px; background: var(--border); border-radius: 3px;
      margin-top: 20px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--green), var(--accent));
      transition: width 1.5s ease-out;
      width: 0;
    }

    /* Feature list */
    .feature-list { list-style: none; }

    .feature-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.4s ease-out both;
    }
    .feature-item:last-child { border-bottom: none; }

    /* Status icon */
    .status-icon {
      width: 22px; height: 22px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0; margin-top: 2px;
    }
    .status-done {
      background: var(--green-dim); color: var(--green);
    }
    .status-progress {
      background: var(--amber-dim); color: var(--amber);
    }
    .status-todo {
      background: rgba(92,98,120,0.15); color: var(--text-faint);
    }

    /* Feature content */
    .feature-name {
      font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.5;
    }
    .feature-name.is-done { color: var(--text-dim); }
    .feature-detail {
      font-size: 12px; color: var(--text-faint); margin-top: 2px; line-height: 1.5;
    }

    /* Phase badge */
    .phase-badge {
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      padding: 3px 8px; border-radius: 4px;
      white-space: nowrap; margin-top: 2px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .pb-1 { background: rgba(52,211,153,0.08); color: var(--green); }
    .pb-2 { background: rgba(77,142,255,0.08); color: var(--accent); }
    .pb-25 { background: rgba(245,158,11,0.08); color: var(--amber); }
    .pb-3 { background: rgba(167,139,250,0.08); color: var(--purple); }
    .pb-4 { background: rgba(248,113,113,0.08); color: var(--red); }
    .pb-5 { background: rgba(52,211,153,0.08); color: var(--green); }
    .pb-6 { background: rgba(77,142,255,0.08); color: var(--accent); }
    .pb-7 { background: rgba(245,158,11,0.08); color: var(--amber); }
    .pb-8 { background: rgba(167,139,250,0.08); color: var(--purple); }
    .pb-9 { background: rgba(248,113,113,0.08); color: var(--red); }
    .pb-10 { background: rgba(52,211,153,0.08); color: var(--green); }
    .pb-11 { background: rgba(77,142,255,0.08); color: var(--accent); }

    /* Section dividers */
    .section-divider {
      padding: 40px 0 16px;
      display: flex; align-items: center; gap: 16px;
    }
    .section-divider h3 {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; white-space: nowrap;
    }
    .section-divider.sec-done h3 { color: var(--green); }
    .section-divider.sec-progress h3 { color: var(--amber); }
    .section-divider.sec-todo h3 { color: var(--text-faint); }
    .section-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .section-count {
      font-family: var(--mono); font-size: 11px; color: var(--text-faint);
      font-weight: 600;
    }

    /* Footer */
    .footer {
      margin-top: 60px; padding-top: 32px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-faint); text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .container { padding: 40px 20px 80px; }
      .header h2 { font-size: 28px; }
      .feature-item { grid-template-columns: 24px 1fr; }
      .phase-badge { display: none; }
      .header-meta { gap: 16px; }
    }
  </style>
</head>

function phaseLabel(p) {
  if (p === 2.5) return 'P2.5';
  return 'P' + p;
}

function render() {
  const done = features.filter(f => f.s === 'done');
  const progress = features.filter(f => f.s === 'progress');
  const todo = features.filter(f => f.s === 'todo');

  document.getElementById('count-done').textContent = done.length;
  document.getElementById('count-progress').textContent = progress.length;
  document.getElementById('count-todo').textContent = todo.length;

  const total = features.length;
  const pct = Math.round((done.length / total) * 100);
  setTimeout(() => {
    document.getElementById('progress-fill').style.width = pct + '%';
  }, 300);

  const el = document.getElementById('roadmap');
  let html = '';

  // Done section
  html += `<div class="section-divider sec-done">
    <h3>Completed</h3>
    <span class="section-count">${done.length}</span>
  </div>`;
  html += '<ul class="feature-list">';
  done.forEach((f, i) => {
    html += `<li class="feature-item" style="animation-delay:${i * 0.03}s">
      <div class="status-icon status-done">✓</div>
      <div>
        <div class="feature-name is-done">${f.n}</div>
        <div class="feature-detail">${f.d}</div>
      </div>
      <div class="phase-badge pb-${String(f.p).replace('.','')}">${phaseLabel(f.p)}</div>
    </li>`;
  });
  html += '</ul>';

  // In Progress section
  html += `<div class="section-divider sec-progress">
    <h3>In Progress</h3>
    <span class="section-count">${progress.length}</span>
  </div>`;
  html += '<ul class="feature-list">';
  progress.forEach((f, i) => {
    html += `<li class="feature-item" style="animation-delay:${(done.length + i) * 0.03}s">
      <div class="status-icon status-progress">◐</div>
      <div>
        <div class="feature-name">${f.n}</div>
        <div class="feature-detail">${f.d}</div>
      </div>
      <div class="phase-badge pb-${String(f.p).replace('.','')}">${phaseLabel(f.p)}</div>
    </li>`;
  });
  html += '</ul>';

  // Planned section
  html += `<div class="section-divider sec-todo">
    <h3>Planned</h3>
    <span class="section-count">${todo.length}</span>
  </div>`;
  html += '<ul class="feature-list">';
  todo.forEach((f, i) => {
    html += `<li class="feature-item" style="animation-delay:${(done.length + progress.length + i) * 0.03}s">
      <div class="status-icon status-todo">○</div>
      <div>
        <div class="feature-name">${f.n}</div>
        <div class="feature-detail">${f.d}</div>
      </div>
      <div class="phase-badge pb-${String(f.p).replace('.','')}">${phaseLabel(f.p)}</div>
    </li>`;
  });
  html += '</ul>';

  el.innerHTML = html;
}

render();
</script>
