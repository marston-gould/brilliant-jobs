<!DOCTYPE html>
<html><head><title>BJ Resume Debug</title>
  <link rel="icon" href="/img/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="/js/version.js"></script>
</head>
<body style="background:#0f1117;color:#f0f1f3;font-family:'JetBrains Mono',monospace;padding:20px;font-size:13px;">
<h2 style="color:#3b82f6;">Resume Scoring Debug — <span class="bj-version"></span></h2>
<pre id="out" style="white-space:pre-wrap;line-height:1.6;"></pre>
<script>
const o = document.getElementById('out');
function log(m) { o.textContent += m + '\n'; }

// IndexedDB reader
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('bj_resume_files', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('files');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getFile(db, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readonly');
    const store = tx.objectStore('files');
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function run() {
  try {
    const resumes = JSON.parse(localStorage.getItem('bj_resumes') || '[]');
    const sf = JSON.parse(localStorage.getItem('bj_saved_filters') || '[]');

    log('========== MAMMOTH CHECK ==========');
    log('mammoth loaded: ' + (typeof mammoth !== 'undefined'));
    if (typeof mammoth !== 'undefined') {
      log('mammoth.extractRawText: ' + (typeof mammoth.extractRawText));
    }

    log('\n========== RESUMES (' + resumes.length + ') ==========');
    resumes.forEach((r, i) => {
      log('[' + i + '] "' + r.name + '"');
      log('    id:            ' + r.id);
      log('    textStatus:    ' + (r.textStatus || 'NOT SET'));
      log('    keywords:      ' + (r.keywords ? r.keywords.length + ' terms' : 'NONE'));
      log('    extractedText: ' + (r.extractedText ? r.extractedText.length + ' chars' : 'NONE'));
      log('    filterIds:     ' + JSON.stringify(r.filterIds || []));
      log('    fileName:      ' + (r.fileName || '?'));
    });

    log('\n========== INDEXEDDB FILE CHECK ==========');
    let db;
    try {
      db = await openDB();
      log('IndexedDB opened OK');
    } catch(e) {
      log('❌ IndexedDB FAILED: ' + e.message);
      return;
    }

    for (let i = 0; i < resumes.length; i++) {
      const r = resumes[i];
      if (r.archived) continue;
      log('\nResume[' + i + '] id=' + r.id);
      try {
        const blob = await getFile(db, r.id);
        if (!blob) {
          log('  ❌ No file in IndexedDB for this id');
          continue;
        }
        log('  ✅ File found: type=' + (blob.type || 'unknown') + ', size=' + blob.size + ' bytes');

        // Try mammoth extraction right here
        if (/\.docx$/i.test(r.fileName) && typeof mammoth !== 'undefined') {
          log('  Attempting mammoth extraction...');
          try {
            const arrayBuffer = await blob.arrayBuffer();
            log('  ArrayBuffer: ' + arrayBuffer.byteLength + ' bytes');
            const result = await mammoth.extractRawText({ arrayBuffer });
            const text = (result.value || '').trim();
            log('  ✅ MAMMOTH SUCCESS: ' + text.length + ' chars extracted');
            if (text.length > 0) {
              log('  Preview: "' + text.substring(0, 300).replace(/\n/g, ' ') + '..."');
              log('');
              log('  🔧 FIX: Paste this in console to update the resume:');
              log('  ──────────────────────────────────────────');
              log('  var r = JSON.parse(localStorage.getItem("bj_resumes")); r[' + i + '].extractedText = ' + JSON.stringify(text.substring(0, 100)) + '...; // truncated for display');
              log('  ──────────────────────────────────────────');
            } else {
              log('  ⚠️ Mammoth returned empty text');
            }
            if (result.messages && result.messages.length > 0) {
              log('  Mammoth messages: ' + JSON.stringify(result.messages));
            }
          } catch (me) {
            log('  ❌ MAMMOTH ERROR: ' + me.message);
            log('  Stack: ' + me.stack);
          }
        }

        // Also check first bytes
        const slice = await blob.slice(0, 4).arrayBuffer();
        const bytes = new Uint8Array(slice);
        const header = String.fromCharCode(...bytes);
        log('  First 4 bytes: ' + header + ' (hex: ' + Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(' ') + ')');
        if (header.startsWith('PK')) {
          log('  → ZIP/DOCX format confirmed');
        }
      } catch(e) {
        log('  ❌ Error: ' + e.message);
      }
    }
  } catch(e) {
    log('FATAL ERROR: ' + e.message + '\n' + e.stack);
  }
}

// Wait for mammoth to load
setTimeout(run, 1000);
</script>
<footer style="text-align:center;padding:16px;font-size:11px;color:#666;">&copy; <span class="bj-year"></span> Brilliant Jobs</footer>
</body></html>
