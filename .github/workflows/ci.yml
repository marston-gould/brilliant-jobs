# Brilliant Jobs — CI: 10 Quality Gates
# CS-021 FIX-22: Full quality gate enforcement
# Runs on all PRs to main/staging, and pushes to main/staging
#
# Gates:
#   1. No Silent Failures (ESLint)
#   2. Monitoring Verification (PostHog check)
#   3. Test Coverage + Bundle Size
#   4. Edge Function Auth Check
#   5. Access Control / Secret Scan
#   6. Instrumentation Coverage (PostHog events)
#   7. Type Safety (ESLint strict rules)
#   8. Design System Linter (inline style check)
#   9. Deployment Pipeline (build + version + bundles)
#  10. Compliance Checklist (PR template enforced)

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Gate 1 + 7: ESLint (No Silent Failures + Type Safety) ────────
  lint:
    name: "Gate 1+7: ESLint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run ESLint
        run: npx eslint . --max-warnings 0 2>&1 || true
        # Note: || true during initial rollout; remove after legacy cleanup.

      - name: Gate 1+7 summary
        run: echo "✅ Gate 1+7 ESLint checks complete" >> $GITHUB_STEP_SUMMARY

  # ─── Gate 2 + 6: PostHog Monitoring + Instrumentation ─────────────
  monitoring:
    name: "Gate 2+6: Monitoring Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify PostHog on all surfaces
        run: node scripts/gate-posthog-verify.mjs

      - name: Gate 2+6 summary
        run: echo "✅ Gate 2+6 PostHog monitoring verified" >> $GITHUB_STEP_SUMMARY

  # ─── Gate 3: Tests + Bundle Size ───────────────────────────────────
  test:
    name: "Gate 3: Tests + Bundle Size"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Check bundle sizes
        run: node scripts/gate-bundle-size.mjs

      - name: Test summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          npx vitest run --reporter=json 2>/dev/null | jq -r '
            "- **Files:** \(.numTotalTestSuites) (\(.numPassedTestSuites) passed, \(.numFailedTestSuites) failed)",
            "- **Tests:** \(.numTotalTests) (\(.numPassedTests) passed, \(.numFailedTests) failed)"
          ' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "See test output above." >> $GITHUB_STEP_SUMMARY

  # ─── Gate 4: Edge Function Auth Check ──────────────────────────────
  ef-auth:
    name: "Gate 4: Edge Function Auth"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan Edge Functions for auth
        run: node scripts/gate-ef-auth-scan.mjs

      - name: Gate 4 summary
        run: echo "✅ Gate 4 All Edge Functions have auth" >> $GITHUB_STEP_SUMMARY

  # ─── Gate 5: Secret Scan ───────────────────────────────────────────
  secret-scan:
    name: "Gate 5: Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan for hardcoded secrets
        run: node scripts/gate-secret-scan.mjs

      - name: Check for service role key in client code
        run: |
          if grep -r "service_role" js/ extension/utils/ extension/handlers/ --include="*.js" 2>/dev/null | grep -v "test" | grep -v "node_modules"; then
            echo "::error::Service role key reference found in client code!"
            exit 1
          fi
          echo "✅ No service role key in client code"

      - name: Gate 5 summary
        run: echo "✅ Gate 5 No hardcoded secrets" >> $GITHUB_STEP_SUMMARY

  # ─── Gate 8: Design System (no hardcoded colors/inline styles) ─────
  design-check:
    name: "Gate 8: Design System"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new inline styles in HTML
        run: |
          INLINE_COUNT=$(grep -r 'style="' index.html dashboard.html admin.html roadmap.html 2>/dev/null | wc -l || echo "0")
          echo "Inline style occurrences: $INLINE_COUNT"
          if [ "$INLINE_COUNT" -gt 100 ]; then
            echo "::error::Too many inline styles ($INLINE_COUNT > 100). Use Tailwind classes."
            exit 1
          fi
          echo "✅ Inline style count within limit ($INLINE_COUNT)"

      - name: Gate 8 summary
        run: echo "✅ Gate 8 Design system check passed" >> $GITHUB_STEP_SUMMARY

  # ─── Gate 9: Build + Version + Extension ───────────────────────────
  build:
    name: "Gate 9: Build + Version"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build dashboard bundle
        run: node build.js

      - name: Build admin bundle
        run: node build-admin.js

      - name: Build CSS
        run: npx tailwindcss -i src/input.css -o styles.css --minify

      - name: Verify bundles are up to date
        run: |
          if ! git diff --quiet dist/ styles.css; then
            echo "::error::Bundles are stale. Run build locally and commit."
            git diff --stat dist/ styles.css
            exit 1
          fi
          echo "✅ All bundles up to date"

      - name: Version sync check
        run: |
          if [ -f scripts/pre-commit-version-check.sh ]; then
            bash scripts/pre-commit-version-check.sh
          fi

      - name: Extension build + manifest validation
        run: |
          if [ -f extension/build-extension.js ]; then
            node extension/build-extension.js
            echo "✅ Extension builds successfully"
          fi
          node -e "
            const m = require('./extension/manifest.json');
            const required = ['name', 'version', 'manifest_version', 'permissions'];
            const missing = required.filter(k => !m[k]);
            if (missing.length) {
              console.error('Missing manifest keys:', missing.join(', '));
              process.exit(1);
            }
            console.log('✅ Manifest valid:', m.name, 'v' + m.version);
          "

      - name: Gate 9 summary
        run: echo "✅ Gate 9 Build + version checks passed" >> $GITHUB_STEP_SUMMARY

  # ─── Gate 10: Compliance (npm audit + SRI) ─────────────────────────
  compliance:
    name: "Gate 10: Compliance + Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: npm audit (advisory check)
        run: npm audit --audit-level=high 2>&1 || true

      - name: Check CDN scripts for SRI
        run: |
          for file in index.html dashboard.html admin.html; do
            if [ -f "$file" ]; then
              CDN_SCRIPTS=$(grep -c 'src="https://cdn\|src="https://cdnjs\|src="https://unpkg' "$file" 2>/dev/null || echo "0")
              SRI_SCRIPTS=$(grep -c 'integrity="sha' "$file" 2>/dev/null || echo "0")
              echo "$file: $CDN_SCRIPTS CDN scripts, $SRI_SCRIPTS with SRI"
            fi
          done
          echo "✅ CDN/SRI audit complete"

      - name: Gate 10 summary
        run: echo "✅ Gate 10 Compliance checks passed" >> $GITHUB_STEP_SUMMARY

  # ─── Summary Gate: All must pass ───────────────────────────────────
  all-gates:
    name: "All Quality Gates"
    needs: [lint, monitoring, test, ef-auth, secret-scan, design-check, build, compliance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all gates
        if: |
          needs.lint.result != 'success' ||
          needs.monitoring.result != 'success' ||
          needs.test.result != 'success' ||
          needs.ef-auth.result != 'success' ||
          needs.secret-scan.result != 'success' ||
          needs.design-check.result != 'success' ||
          needs.build.result != 'success' ||
          needs.compliance.result != 'success'
        run: |
          echo "❌ One or more quality gates failed" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: All passed
        if: |
          needs.lint.result == 'success' &&
          needs.monitoring.result == 'success' &&
          needs.test.result == 'success' &&
          needs.ef-auth.result == 'success' &&
          needs.secret-scan.result == 'success' &&
          needs.design-check.result == 'success' &&
          needs.build.result == 'success' &&
          needs.compliance.result == 'success'
        run: echo "✅ All 10 quality gates passed" >> $GITHUB_STEP_SUMMARY
