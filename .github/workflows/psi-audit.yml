name: PageSpeed Insights Audit
on:
  schedule:
    # Run weekly on Monday at 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  psi-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract URLs from sitemap
        id: urls
        run: |
          # Parse sitemap.xml for URLs
          URLS=$(grep -oP '<loc>\K[^<]+' sitemap.xml | head -20)
          echo "Found URLs:"
          echo "$URLS"
          echo "urls<<URLEOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "URLEOF" >> $GITHUB_OUTPUT

      - name: Run PSI audits
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          mkdir -p psi-results
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RESULTS_FILE="psi-results/audit-$(date -u +%Y%m%d).json"
          
          echo '{"timestamp":"'"$TIMESTAMP"'","pages":[' > "$RESULTS_FILE"
          FIRST=true
          
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "Auditing: $URL"
            
            # PSI API call (mobile strategy)
            RESPONSE=$(curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeedTest?url=${URL}&strategy=mobile&key=${PSI_API_KEY}&category=performance&category=accessibility" 2>/dev/null || echo '{}')
            
            # Extract key metrics
            FCP=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('lighthouseResult',{}).get('audits',{}).get('first-contentful-paint',{}).get('numericValue','N/A'))" 2>/dev/null || echo "N/A")
            LCP=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('lighthouseResult',{}).get('audits',{}).get('largest-contentful-paint',{}).get('numericValue','N/A'))" 2>/dev/null || echo "N/A")
            CLS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('lighthouseResult',{}).get('audits',{}).get('cumulative-layout-shift',{}).get('numericValue','N/A'))" 2>/dev/null || echo "N/A")
            TBT=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('lighthouseResult',{}).get('audits',{}).get('total-blocking-time',{}).get('numericValue','N/A'))" 2>/dev/null || echo "N/A")
            PERF=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('lighthouseResult',{}).get('categories',{}).get('performance',{}).get('score','N/A'))" 2>/dev/null || echo "N/A")
            A11Y=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('lighthouseResult',{}).get('categories',{}).get('accessibility',{}).get('score','N/A'))" 2>/dev/null || echo "N/A")
            
            # Collect failing audits
            FAILURES=$(echo "$RESPONSE" | python3 -c "
import json, sys
d = json.load(sys.stdin)
audits = d.get('lighthouseResult',{}).get('audits',{})
fails = []
for k,v in audits.items():
    if v.get('score') is not None and v['score'] < 0.9 and v.get('scoreDisplayMode') != 'informative':
        fails.append({'id':k,'title':v.get('title',''),'score':v['score']})
print(json.dumps(fails[:10]))
" 2>/dev/null || echo "[]")
            
            if [ "$FIRST" = true ]; then FIRST=false; else echo "," >> "$RESULTS_FILE"; fi
            
            echo "{\"url\":\"$URL\",\"fcp\":$FCP,\"lcp\":$LCP,\"cls\":$CLS,\"tbt\":$TBT,\"perf_score\":$PERF,\"a11y_score\":$A11Y,\"failures\":$FAILURES}" >> "$RESULTS_FILE"
            
            # Rate limit: PSI allows ~25 req/100s with API key
            sleep 5
          done <<< "${{ steps.urls.outputs.urls }}"
          
          echo ']}'  >> "$RESULTS_FILE"
          
          echo "=== AUDIT SUMMARY ==="
          python3 -c "
import json
with open('$RESULTS_FILE') as f:
    data = json.load(f)
for p in data['pages']:
    perf = p.get('perf_score','?')
    perf_pct = f'{float(perf)*100:.0f}%' if perf not in ['N/A','?'] else perf
    a11y = p.get('a11y_score','?')
    a11y_pct = f'{float(a11y)*100:.0f}%' if a11y not in ['N/A','?'] else a11y
    fcp = f\"{float(p.get('fcp',0))/1000:.1f}s\" if p.get('fcp') not in ['N/A'] else 'N/A'
    lcp = f\"{float(p.get('lcp',0))/1000:.1f}s\" if p.get('lcp') not in ['N/A'] else 'N/A'
    fails = len(p.get('failures',[]))
    print(f\"  {p['url']}\")
    print(f\"    Perf: {perf_pct} | A11y: {a11y_pct} | FCP: {fcp} | LCP: {lcp} | Failures: {fails}\")
"

      - name: Check for regressions
        run: |
          python3 << 'PYEOF'
          import json, glob, sys
          
          # Find latest two audit files
          files = sorted(glob.glob('psi-results/audit-*.json'))
          if len(files) < 2:
              print("Not enough history for regression check")
              sys.exit(0)
          
          with open(files[-1]) as f:
              current = json.load(f)
          with open(files[-2]) as f:
              previous = json.load(f)
          
          prev_by_url = {p['url']: p for p in previous['pages']}
          regressions = []
          
          for page in current['pages']:
              url = page['url']
              if url not in prev_by_url:
                  continue
              prev = prev_by_url[url]
              
              # Check for perf score drop > 10 points
              try:
                  curr_score = float(page.get('perf_score', 0))
                  prev_score = float(prev.get('perf_score', 0))
                  if prev_score - curr_score > 0.1:
                      regressions.append(f"PERF REGRESSION: {url} dropped from {prev_score*100:.0f}% to {curr_score*100:.0f}%")
              except:
                  pass
              
              # Check for LCP increase > 1s
              try:
                  curr_lcp = float(page.get('lcp', 0))
                  prev_lcp = float(prev.get('lcp', 0))
                  if curr_lcp - prev_lcp > 1000:
                      regressions.append(f"LCP REGRESSION: {url} increased from {prev_lcp/1000:.1f}s to {curr_lcp/1000:.1f}s")
              except:
                  pass
          
          if regressions:
              print("⚠️ REGRESSIONS DETECTED:")
              for r in regressions:
                  print(f"  {r}")
              sys.exit(1)
          else:
              print("✅ No regressions detected")
          PYEOF

      - name: Commit results
        run: |
          git config user.name "PSI Audit Bot"
          git config user.email "bot@brilliantjobs.app"
          git add psi-results/
          git diff --cached --quiet || git commit -m "chore: PSI audit $(date -u +%Y-%m-%d)"
          git push
