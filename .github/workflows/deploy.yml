# Brilliant Jobs — Deploy Pipeline
# CS-020 FIX-21: Enhanced CI/CD with staging support, admin bundles, extension hosting
#
# Triggers on push to main:
#   - Supabase migrations (when migration files change)
#   - Edge Function deploys (when function code changes)
#   - Tailwind CSS rebuild (when src/input.css or tailwind.config.js change)
#   - JS bundle rebuild — dashboard + admin (when js/ files change)
#   - Extension build (when extension/ files change)
#
# Staging branch gets preview deploys automatically via Vercel.
# Production deploys only from main.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'src/app/**'
      - 'src/input.css'
      - 'tailwind.config.js'
      - 'js/**'
      - 'build.js'
      - 'build-admin.js'
      - 'extension/**'

jobs:
  # ── Database Migrations ─────────────────────────────────
  migrate:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── Edge Function Deploys ───────────────────────────────
  deploy-functions:
    name: Edge Function Deploy
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'supabase/functions/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy changed functions
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- supabase/functions/ | grep -oP 'functions/\K[^/]+' | sort -u)
          DEPLOYED=0
          for fn in $CHANGED; do
            if [ -d "supabase/functions/$fn" ] && [ "$fn" != "_shared" ]; then
              echo "Deploying $fn..."
              supabase functions deploy "$fn" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
              DEPLOYED=$((DEPLOYED + 1))
            fi
          done
          echo "### Edge Functions Deployed: $DEPLOYED" >> $GITHUB_STEP_SUMMARY
          for fn in $CHANGED; do
            [ "$fn" != "_shared" ] && echo "- \`$fn\`" >> $GITHUB_STEP_SUMMARY
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── CSS Rebuild ─────────────────────────────────────────
  rebuild-css:
    name: Rebuild CSS
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'src/input.css') ||
      contains(github.event.head_commit.modified, 'tailwind.config.js')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tailwindcss -i src/input.css -o styles.css --minify
      - name: Commit rebuilt CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet styles.css; then
            echo "No CSS changes detected"
          else
            git add styles.css
            git commit -m "ci: rebuild styles.css from input.css changes"
            git push
          fi

  # ── JS Bundle Rebuild (Dashboard + Admin) ───────────────
  rebuild-js:
    name: Rebuild JS Bundles
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'js/') ||
      contains(github.event.head_commit.modified, 'build.js') ||
      contains(github.event.head_commit.modified, 'build-admin.js')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Build dashboard bundle
        run: node build.js

      - name: Build admin bundle
        run: node build-admin.js

      - name: Commit rebuilt bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED=""
          if ! git diff --quiet dist/dashboard*.js dist/dashboard*.map; then
            git add dist/dashboard.js dist/dashboard.min.js dist/dashboard.min.js.map
            git add dist/dashboard-*.min.js dist/dashboard-*.min.js.map 2>/dev/null || true
            CHANGED="dashboard"
          fi
          if ! git diff --quiet dist/admin*.js dist/admin*.map; then
            git add dist/admin.js dist/admin.min.js dist/admin.min.js.map
            CHANGED="$CHANGED admin"
          fi
          if [ -n "$CHANGED" ]; then
            git commit -m "ci: rebuild bundles ($CHANGED)"
            git push
          else
            echo "No bundle changes detected"
          fi


  # ── SPA Bundle Rebuild (Vite/React) ─────────────────────
  rebuild-spa:
    name: Rebuild SPA Bundle
    runs-on: ubuntu-latest
    # No if: condition — workflow-level paths filter (src/app/**) handles gating
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build SPA
        run: npm run build:spa 2>&1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Patch BJ_VERSION into built index.html
        run: |
          VERSION=$(node -e "const fs=require('fs');const t=fs.readFileSync('js/version.js','utf8');const m=t.match(/v[0-9]+\.[0-9]+/);process.stdout.write(m?m[0]:'v0.0')")
          echo "Patching BJ_VERSION=$VERSION"
          sed -i "s|window.BJ_VERSION=\"[^\"]*\"|window.BJ_VERSION=\"$VERSION\"|g" dist/spa/src/app/index.html || true

      - name: Commit built SPA bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet dist/spa/; then
            echo "No SPA bundle changes"
          else
            git add dist/spa/
            git commit -m "ci: rebuild SPA bundle [skip ci]"
            git push
          fi

  # ── Extension Build + Artifact ──────────────────────────
  build-extension:
    name: Build Extension
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'extension/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Build extension package
        run: |
          if [ -f extension/build-extension.js ]; then
            node extension/build-extension.js
          fi

      - name: Package extension ZIP
        run: |
          cd extension
          zip -r ../brilliant-jobs-extension.zip . \
            -x "examples/*" "build-extension.js" "*.test.*" "node_modules/*"
          cd ..
          echo "Extension packaged: $(du -h brilliant-jobs-extension.zip | cut -f1)"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: brilliant-jobs-extension-${{ github.sha }}
          path: brilliant-jobs-extension.zip
          retention-days: 30

      - name: Post summary
        run: |
          echo "### Extension Build" >> $GITHUB_STEP_SUMMARY
          echo "- Package: brilliant-jobs-extension.zip" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(du -h brilliant-jobs-extension.zip | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
