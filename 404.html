<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/img/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not So Brilliant | Brilliant Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e1a;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 600px 400px at 20% 50%, rgba(61,126,255,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 80% 30%, rgba(168,85,247,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 60% 80%, rgba(236,72,153,0.05) 0%, transparent 70%);
    animation: bgShift 12s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.1); }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
    max-width: 560px;
  }

  .bulb {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 8px;
    filter: grayscale(0.8) brightness(0.6);
    animation: flicker 4s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes flicker {
    0%, 100% { filter: grayscale(0.8) brightness(0.6); transform: rotate(-2deg); }
    5% { filter: grayscale(0) brightness(1.2); transform: rotate(0deg); }
    6% { filter: grayscale(0.8) brightness(0.6); transform: rotate(-1deg); }
    8% { filter: grayscale(0) brightness(1); transform: rotate(0deg); }
    9% { filter: grayscale(0.8) brightness(0.5); transform: rotate(-2deg); }
    50% { filter: grayscale(0.8) brightness(0.5); transform: rotate(-1deg); }
  }

  .code {
    font-size: 140px;
    font-weight: 800;
    letter-spacing: -6px;
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 16px;
    position: relative;
  }

  .code::after {
    content: '404';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 140px;
    font-weight: 800;
    letter-spacing: -6px;
    background: linear-gradient(135deg, rgba(61,126,255,0.15) 0%, rgba(168,85,247,0.1) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glitch 4s ease-in-out infinite;
  }

  @keyframes glitch {
    0%, 100% { transform: translate(-50%, -50%); opacity: 0; }
    5%, 6% { transform: translate(calc(-50% + 3px), calc(-50% - 2px)); opacity: 1; }
    8%, 9% { transform: translate(calc(-50% - 2px), calc(-50% + 1px)); opacity: 0.8; }
    50% { transform: translate(-50%, -50%); opacity: 0; }
  }

  .tagline {
    font-size: 28px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .tagline em {
    font-style: italic;
    color: #64748b;
    text-decoration: line-through;
    text-decoration-color: rgba(236,72,153,0.4);
  }

  .sub {
    font-size: 15px;
    font-weight: 300;
    color: #475569;
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: linear-gradient(135deg, #3d7eff 0%, #6366f1 100%);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(61,126,255,0.25);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(61,126,255,0.35);
  }

  .footer-note {
    margin-top: 48px;
    font-size: 11px;
    color: #334155;
    font-weight: 300;
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(61,126,255,0.15);
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
</style>
  <script src="/js/version.js"></script>
</head>
<body>
  <div class="container">
    <div class="bulb">💡</div>
    <div class="code">404</div>
    <div class="tagline">Not so <em>brilliant</em></div>
    <div class="sub">This page doesn't exist. Much like that dream job<br>that turned out to be a scam on Craigslist.</div>
    <a href="/" class="btn">Back to the Dashboard →</a>
    <div class="footer-note">Even the best job seekers take wrong turns sometimes.</div>
    <div class="footer-note" style="margin-top:12px;">&copy; <span class="bj-year"></span> Brilliant Jobs</div>
  </div>
  <script>
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = Math.random() * 10 + 's';
      p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
      p.style.background = Math.random() > 0.5 
        ? 'rgba(61,126,255,0.15)' 
        : 'rgba(168,85,247,0.12)';
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
